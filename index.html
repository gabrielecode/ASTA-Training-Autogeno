          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Sì, il Training Autogeno è un metodo di medicina complementare riconosciuto dal Registro di Medicina Empirica (RME). Le sedute svolte presso le terapiste ASTA certificate RME in Ticino (a Lugano, Gordevio e Preonzo) possono essere rimborsate dalle assicurazioni complementari (LCA) che includono questo metodo. Si consiglia di verificare preventivamente la propria copertura presso la propria cassa malati."

          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Nella maggior parte dei casi, per le terapie complementari riconosciute RME non è necessaria una prescrizione medica, poiché il rimborso rientra nell'assicurazione complementare. Tuttavia, condizioni e franchigie variano in base alla singola cassa malati: ti invitiamo a chiedere conferma diretta al tuo assicuratore prima di iniziare il percorso."
          }
        },
        {
          "@type": "Question",
          "name": "Quante sedute servono e quanto tempo richiede l'esercizio quotidiano?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Il percorso standard prevede 10 incontri con una terapista qualificata per apprendere gradualmente le formule del metodo. Tra una seduta e l'altra, l'allenamento quotidiano a casa richiede solo 5-10 minuti, ripetuti 2 o 3 volte al giorno: la costanza permette di rendere il rilassamento automatico e duraturo."
          }
        },
        {
          "@type": "Question",
          "name": "Che differenza c'è tra Training Autogeno, meditazione o ipnosi?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Ideato dallo psichiatra J.H. Schultz, il Training Autogeno è una tecnica di autodistensione psicosomatica strutturata in esercizi fisici e mentali precisi (pesantezza, calore, respiro). A differenza dell'ipnosi, non prevede suggestioni esterne da parte del terapeuta: è la persona stessa a generare lo stato di calma in piena autonomia e coscienza."
          }
        },
        {
          "@type": "Question",
          "name": "Posso praticare il Training Autogeno se assumo farmaci o ho una patologia?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Il Training Autogeno è un metodo complementare di prevenzione e benessere che non sostituisce diagnosi o cure mediche. In presenza di patologie fisiche o psichiche, o se si assumono farmaci, è sempre consigliato parlarne preventivamente con il proprio medico e con la terapista per valutare l'idoneità del percorso."
