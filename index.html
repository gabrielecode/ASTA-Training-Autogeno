    <script id="faq-jsonld" type="application/ld+json">
      {

        "@type": "FAQPage",

        "name": "Domande frequenti – Associazione di Training Autogeno Svizzera (ASTA)",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "Il TA è rimborsato dalla cassa malattia complementare in Svizzera?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Sì, il Training Autogeno è un metodo di medicina complementare riconosciuto dal Registro di Medicina Empirica (RME). Le sedute sono rimborsate dalle assicurazioni complementari (LCA) che includono questo metodo: si consiglia di verificare preventivamente la propria copertura presso la propria cassa malati."
            }
          },
          {
            "@type": "Question",
            "name": "Serve la prescrizione medica per il rimborso?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Nella maggior parte dei casi, per le terapie complementari riconosciute RME non è necessaria una prescrizione medica. Tuttavia, condizioni e franchigie variano in base alla singola copertura: vi invitiamo a chiedere conferma diretta alla sua assicurazione prima di iniziare il percorso."
            }
          },
          {
            "@type": "Question",
            "name": "Quanti incontri e quanto tempo richiede l’esercizio quotidiano?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Il percorso prevede 10 incontri con una terapista qualificata per apprendere gradualmente le formule del metodo. Tra un incontro e l’altro è raccomandato l’allenamento quotidiano di circa 15-20 minuti: la costanza permette il raggiungimento dello stato desiderato in autonomia."
            }
          },
          {
            "@type": "Question",
            "name": "Che differenza c’è tra Training Autogeno, ipnosi e meditazione?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Ideato dallo psichiatra J.H. Schultz, il Training Autogeno è una tecnica di autodistensione psicosomatica strutturata in esercizi fisici e mentali precisi (pesantezza, calore, respiro). A differenza dell’ipnosi, non prevede suggestioni esterne da parte del terapeuta: è la persona stessa a generare lo stato di calma in piena autonomia e coscienza. A differenza della meditazione, inoltre, non si basa sull’osservazione distaccata dei pensieri o della realtà presente, ma utilizza formule mentali precise per attivare una risposta fisiologica concreta di distensione."
            }
          },
          {
            "@type": "Question",
            "name": "Posso praticare il TA se assumo farmaci o ho una patologia?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Il Training Autogeno è un metodo che non sostituisce diagnosi o cure mediche. In presenza di patologie fisiche o psichiche, o se si assumono farmaci, è consigliato parlarne preventivamente con il proprio medico per valutare l’idoneità del percorso."
            }
          }
        ]
